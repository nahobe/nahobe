<script>
(function(){
var items = Array.prototype.slice.call(document.querySelectorAll('.ph-item'));
var lightbox = document.getElementById('lightbox');
var lbImg = document.getElementById('lb-img');
var lbCaption = document.getElementById('lb-caption');
var idx = 0;
function show(i){
idx = (i + items.length) % items.length;
var el = items[idx];
lbImg.src = el.getAttribute('data-src');
lbCaption.textContent = el.getAttribute('data-caption');
}
items.forEach(function(el, i){
el.addEventListener('click', function(){ show(i); lightbox.classList.add('active'); });
});
document.getElementById('lb-close').addEventListener('click', function(){ lightbox.classList.remove('active'); });
document.getElementById('lb-prev').addEventListener('click', function(e){ e.stopPropagation(); show(idx-1); });
document.getElementById('lb-next').addEventListener('click', function(e){ e.stopPropagation(); show(idx+1); });
lightbox.addEventListener('click', function(e){ if (e.target === lightbox) lightbox.classList.remove('active'); });
document.getElementById('lb-content').addEventListener('click', function(e){ e.stopPropagation(); });
})();
</script>
